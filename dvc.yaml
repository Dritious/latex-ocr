stages:
  download:
    cmd: python src/data/load_hf_data.py
    deps:
      - src/data/load_hf_data.py
    outs:
      - data/raw
  prepare:
    cmd: python src/data/prepare.py
    deps:
      - data/raw/
      - src/data/prepare.py
    outs:
      - data/processed/
  train:
    cmd: python src/train.py
    deps:
      - data/processed/
      - src/train.py
    params:
      - train.epochs
      - train.lr
      - train.batch_size
    outs:
      - models/best_model.pth