model:
  d_model: 256
  n_heads: 8
  max_seq_len: 2048

train:
  epochs: 20
  lr: 3e-4
  batch_size: 64

ru_datasets:
  - name: "20231101.ru"
    source: "wikimedia/wikipedia"
    split: "train"
    columns_map:
      text: text

latex_datasets:
  - name: "cleaned_formulas"
    source: "OleehyO/latex-formulas"
    split: "train"
    columns_map:
      latex_formula: text
      image: image

    
