[project]
name = "latex-ocr"
version = "0.1.0"
description = "Image to LaTeX OCR model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.37.0", 
    "pillow>=10.2.0",       
    "albumentations>=1.4.0",
    "wandb>=0.16.3",        
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
train = "src.train:main"